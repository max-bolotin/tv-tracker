spring.application.name=tv-tracker
spring.config.import=optional:file:.env[.properties]

server.forward-headers-strategy=framework

# Public frontend origin used after OAuth login/logout.
# For local dev set FRONTEND_URL=http://localhost:5173 or pass it in the runtime environment.
# Do not keep a bundled src/main/resources/application-local.properties file in production builds.
app.frontend.url=${FRONTEND_URL:}

# Path where per-user JSON data files are stored.
# The existing Docker setup mounts ./data at /app/data; this relative path preserves that layout.
app.storage.path=./data/users/
# Optional movies directory. When blank, MovieStorageService uses a sibling "movies" directory
# beside app.storage.path (for example, ./data/users -> ./data/movies).
app.storage.movies-path=${MOVIES_STORAGE_PATH:}
app.timezone=${APP_TIMEZONE:Europe/Berlin}

# In-memory cache and manual refresh limits
app.cache.full-refresh-cooldown=PT6H
app.cache.show-details-ttl=PT12H
app.cache.popular-ttl=PT6H
app.cache.movie-details-ttl=PT12H
app.cache.max-entries=1000
app.cache.popular-max-entries=100

# Movie metadata refresh policy
app.movies.refresh.enabled=${MOVIE_REFRESH_ENABLED:true}
app.movies.refresh.cron=0 30 3 * * *
app.movies.refresh.unreleased-interval=PT24H
app.movies.refresh.ratings-recent-interval=P7D
app.movies.refresh.ratings-old-interval=P30D
app.movies.refresh.recent-period=P90D
app.movies.refresh.omdb-max-calls-per-run=100

# NOTE: OAuth client registration is provided dynamically from environment variables
# (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET). Do NOT set spring.security.oauth2.client.* here
# to avoid startup validation when env vars are not present.

# TMDB API key (set your key here or via env var TMDB_API_KEY)
app.tmdb.api-key=${TMDB_API_KEY:}
app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.image-base-url=https://image.tmdb.org/t/p/w500

# TVMaze fallback
app.tvmaze.base-url=https://api.tvmaze.com

# OMDb API key — used for IMDb and Rotten Tomatoes ratings (optional)
app.omdb.api-key=${OMDB_API_KEY:}
app.omdb.base-url=https://www.omdbapi.com
app.omdb.backoff=${OMDB_BACKOFF:PT6H}

# Sessions: make web sessions long-lived (30 days). This sets server-side timeout and makes
# the JSESSIONID cookie persistent so browser restarts keep the session.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d

# File upload limits (multipart). Can be overridden via environment variables for Docker/OCI deployments.
# Use human-readable sizes for multipart properties (e.g. 50MB). Defaults applied when env vars are absent.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:50MB}

# Tomcat: allow larger request body when needed (bytes). Use numeric bytes value.
server.tomcat.max-swallow-size=${MAX_SWALLOW_SIZE:52428800}

# Scheduler: daily check at 03:00
app.scheduler.cron=0 0 3 * * *

# OMDb rating refresh tuning
# Minimum randomized staleness window in days (inclusive)
omdb.rating.staleness-min-days=7
# Maximum randomized staleness window in days (inclusive)
omdb.rating.staleness-max-days=21
# Milliseconds to pause between OMDb requests during the nightly run
omdb.rating.request-pause-ms=1000

# Suppress noisy broken-pipe errors from SSE clients that disconnect
logging.level.org.apache.catalina.core.ContainerBase=OFF
logging.level.root=INFO
logging.level.com.tvtracker=INFO
